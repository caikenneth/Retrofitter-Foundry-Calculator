<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Retrofitter Foundry — Cheat Sheet</title>
<style>
  :root {
    --bg: #0f1117;
    --surface: #161920;
    --surface2: #1c2030;
    --border: #2a2e3d;
    --accent: #c8a04a;
    --text: #ccc8be;
    --text-dim: #6a6860;
    --servo: #7ab85a;
    --thopter: #5aaed4;
    --construct: #d47858;
    --mono: 'Courier New', monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: Georgia, 'Times New Roman', serif;
    min-height: 100vh;
    padding: 40px 20px 80px;
    line-height: 1.6;
  }

  .wrap { max-width: 860px; margin: 0 auto; }

  header {
    text-align: center;
    margin-bottom: 48px;
    padding-bottom: 32px;
    border-bottom: 1px solid var(--border);
  }

  h1 {
    font-size: clamp(1.4rem, 4vw, 2.2rem);
    font-weight: normal;
    color: var(--accent);
    letter-spacing: 0.04em;
    margin-bottom: 6px;
  }

  .subtitle {
    font-size: 0.82rem;
    color: var(--text-dim);
    letter-spacing: 0.14em;
    text-transform: uppercase;
    font-family: var(--mono);
  }

  .card-image {
    margin: 20px auto 0;
    display: block;
    width: 180px;
    border-radius: 10px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.5);
  }

  @media (max-width: 500px) {
    .card-image { width: 150px; }
  }

  .controls {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 24px;
    margin-bottom: 36px;
  }

  .controls-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 16px;
    margin-bottom: 16px;
  }

  .field { display: flex; flex-direction: column; gap: 6px; }

  .field label {
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--text-dim);
    font-family: var(--mono);
  }

  .field input, .field select {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: var(--mono);
    font-size: 1rem;
    padding: 8px 12px;
    border-radius: 4px;
    width: 100%;
    outline: none;
    -webkit-appearance: none;
  }

  .field input:focus, .field select:focus { border-color: var(--accent); }

  .field input[type=number] { font-size: 1.3rem; text-align: center; }

  .sort-row {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }

  .sort-row label {
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--text-dim);
    font-family: var(--mono);
  }

  .sort-row select {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: var(--mono);
    font-size: 0.8rem;
    padding: 6px 10px;
    border-radius: 4px;
    outline: none;
  }

  .sort-row select:focus { border-color: var(--accent); }

  .results-header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 16px;
    flex-wrap: wrap;
    gap: 8px;
  }

  .results-count {
    font-size: 0.75rem;
    color: var(--text-dim);
    font-family: var(--mono);
  }

  .legend {
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 0.7rem;
    color: var(--text-dim);
    font-family: var(--mono);
    white-space: nowrap;
  }

  .dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
  .dot.sv { background: var(--servo); }
  .dot.th { background: var(--thopter); }
  .dot.co { background: var(--construct); }

  .outcome-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    padding: 14px 18px;
    gap: 16px;
    transition: border-color 0.15s;
  }

  .outcome-card:hover { border-color: #3a3e50; }

  .outcome-card.no-change { opacity: 0.38; }

  .outcome-num {
    font-family: var(--mono);
    font-size: 0.7rem;
    color: var(--text-dim);
    min-width: 22px;
  }

  .tokens-row {
    display: flex;
    align-items: center;
    gap: 8px;
    flex: 1;
    flex-wrap: wrap;
  }

  .tok {
    display: flex;
    align-items: baseline;
    gap: 4px;
  }

  .tok-num {
    font-family: var(--mono);
    font-size: 1.5rem;
    font-weight: bold;
    line-height: 1;
  }

  .tok-num.sv { color: var(--servo); }
  .tok-num.th { color: var(--thopter); }
  .tok-num.co { color: var(--construct); }

  .tok-label {
    font-size: 0.65rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--text-dim);
  }

  .tok-sep {
    font-size: 0.7rem;
    color: var(--border);
    padding: 0 2px;
  }

  .outcome-meta {
    font-family: var(--mono);
    font-size: 0.7rem;
    color: var(--text-dim);
    text-align: right;
    white-space: nowrap;
  }

  .nothing-label {
    font-style: italic;
    color: var(--text-dim);
    font-size: 0.85rem;
  }

  .empty {
    text-align: center;
    padding: 48px;
    color: var(--text-dim);
    font-size: 0.9rem;
  }

  footer {
    text-align: center;
    margin-top: 60px;
    font-size: 0.7rem;
    color: var(--text-dim);
    font-family: var(--mono);
    letter-spacing: 0.1em;
    line-height: 2;
  }

  @media (max-width: 500px) {
    .controls { padding: 16px; }
    .tok-num { font-size: 1.2rem; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>Retrofitter Foundry</h1>
    <div class="subtitle">Cheat Sheet</div>
    <img class="card-image" src="https://cards.scryfall.io/large/front/5/d/5da578b8-19e6-4068-9336-e7cd33c585f1.jpg?1592710366" alt="Retrofitter Foundry card">
  </header>

  <div class="controls">
    <div class="controls-grid">
      <div class="field">
        <label>Mana available</label>
        <input type="number" id="manaAvail" value="0" min="0" max="40">
      </div>
      <div class="field">
        <label>Servos on board</label>
        <input type="number" id="startServos" value="0" min="0" max="30">
      </div>
      <div class="field">
        <label>Thopters on board</label>
        <input type="number" id="startThopters" value="0" min="0" max="30">
      </div>
      <div class="field">
        <label>Constructs on board</label>
        <input type="number" id="startConstructs" value="0" min="0" max="30">
      </div>
    </div>
    <div class="sort-row">
      <label>Sort by:</label>
      <select id="sortBy">
        <option value="power">Total power</option>
        <option value="tokens">Total tokens</option>
        <option value="constructs">Most constructs</option>
        <option value="thopters">Most thopters</option>
        <option value="servos">Most servos</option>
        <option value="unused">Least mana unused</option>
      </select>
    </div>
  </div>

  <div class="results-header">
    <div class="legend">
      <div class="legend-item"><div class="dot sv"></div> Servo 1/1</div>
      <div class="legend-item"><div class="dot th"></div> Thopter 1/1 flying</div>
      <div class="legend-item"><div class="dot co"></div> Construct 4/4</div>
    </div>
    <div class="results-count" id="resultsCount"></div>
  </div>

  <div id="output"></div>

  <footer>
    Results show final board state after all activations
  </footer>

</div>

<script>
function computeOutcomes(M, startS, startT, startC) {
  var seen = {};
  var results = [];
  var maxUntaps = Math.floor(M / 3);

  for (var u = 0; u <= maxUntaps; u++) {
    var manaLeft = M - 3 * u;
    var tapsAvail = u + 1;
    var maxA = Math.min(tapsAvail, Math.floor(manaLeft / 2));

    for (var nA = 0; nA <= maxA; nA++) {
      var manaAfterA = manaLeft - 2 * nA;
      var tapsAfterA = tapsAvail - nA;
      var servosAvail = startS + nA;
      var maxB = Math.min(servosAvail, tapsAfterA, manaAfterA);

      for (var nB = 0; nB <= maxB; nB++) {
        var tapsAfterB = tapsAfterA - nB;
        var thoptersAvail = startT + nB;
        var maxC = Math.min(thoptersAvail, tapsAfterB);

        for (var nC = 0; nC <= maxC; nC++) {
          var fS = startS + nA - nB;
          var fT = startT + nB - nC;
          var fC = startC + nC;
          var manaSpent = 3 * u + 2 * nA + 1 * nB;
          var key = fS + ',' + fT + ',' + fC;
          if (!seen[key] || seen[key].manaSpent > manaSpent) {
            seen[key] = { s: fS, t: fT, c: fC, manaSpent: manaSpent };
          }
        }
      }
    }
  }

  for (var k in seen) { results.push(seen[k]); }
  return results;
}

function powerScore(o) { return o.s + o.t + o.c * 4; }
function tokenCount(o) { return o.s + o.t + o.c; }

function sortResults(results, by, M) {
  return results.slice().sort(function(a, b) {
    if (by === 'power') return powerScore(b) - powerScore(a);
    if (by === 'tokens') return tokenCount(b) - tokenCount(a);
    if (by === 'constructs') return b.c !== a.c ? b.c - a.c : powerScore(b) - powerScore(a);
    if (by === 'thopters') return b.t !== a.t ? b.t - a.t : powerScore(b) - powerScore(a);
    if (by === 'servos') return b.s !== a.s ? b.s - a.s : powerScore(b) - powerScore(a);
    if (by === 'unused') return (a.manaSpent - b.manaSpent);
    return 0;
  });
}

function getInt(id) { return Math.max(0, parseInt(document.getElementById(id).value) || 0); }

function render() {
  var sS = getInt('startServos');
  var sT = getInt('startThopters');
  var sC = getInt('startConstructs');
  var M  = getInt('manaAvail');
  var by = document.getElementById('sortBy').value;

  var raw    = computeOutcomes(M, sS, sT, sC);
  var sorted = sortResults(raw, by, M);

  document.getElementById('resultsCount').textContent = sorted.length + ' possible outcome' + (sorted.length !== 1 ? 's' : '');

  var output = document.getElementById('output');

  if (sorted.length === 0) {
    output.innerHTML = '<div class="empty">No activations possible with 0 mana.</div>';
    return;
  }

  var html = '';

  for (var i = 0; i < sorted.length; i++) {
    var o = sorted[i];
    var noChange = (o.s === sS && o.t === sT && o.c === sC);
    var tok = tokenCount(o);
    var manaUnused = M - o.manaSpent;

    var parts = [];
    if (o.s > 0) parts.push('<div class="tok"><span class="tok-num sv">' + o.s + '</span><span class="tok-label">Servo</span></div>');
    if (o.t > 0) parts.push('<div class="tok"><span class="tok-num th">' + o.t + '</span><span class="tok-label">Thopter</span></div>');
    if (o.c > 0) parts.push('<div class="tok"><span class="tok-num co">' + o.c + '</span><span class="tok-label">Construct</span></div>');

    var tokensHtml = parts.length > 0
      ? parts.join('<span class="tok-sep">+</span>')
      : '<span class="nothing-label">No tokens (pass)</span>';

    html += '<div class="outcome-card' + (noChange ? ' no-change' : '') + '">';
    html += '<div class="outcome-num">' + (i + 1) + '.</div>';
    html += '<div class="tokens-row">' + tokensHtml + '</div>';
    html += '<div class="outcome-meta">' + tok + ' token' + (tok !== 1 ? 's' : '') + '<br>' + manaUnused + ' mana unused' + (noChange ? '<br>(no change)' : '') + '</div>';
    html += '</div>';
  }

  output.innerHTML = html;
}

var ids = ['startServos','startThopters','startConstructs','manaAvail','sortBy'];
for (var i = 0; i < ids.length; i++) {
  document.getElementById(ids[i]).addEventListener('input', render);
  document.getElementById(ids[i]).addEventListener('change', render);
}

var numericIds = ['startServos','startThopters','startConstructs','manaAvail'];
for (var j = 0; j < numericIds.length; j++) {
  (function(el) {
    el.addEventListener('focus', function() { el.select(); });
    el.addEventListener('blur', function() { if (el.value === '' || isNaN(el.value)) { el.value = 0; render(); } });
  })(document.getElementById(numericIds[j]));
}

render();
</script>
</body>
</html>
